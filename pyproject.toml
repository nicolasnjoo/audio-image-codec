[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2i"
version = "0.1.0"
description = "Audio <-> image codec: analog payload in luma, graceful degradation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10.1", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["a2i"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
